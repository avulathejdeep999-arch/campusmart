services:
  - type: web
    name: campusmart-backend
    env: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: ./entrypoint.sh
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        value: https://campusmart-6r2h.vercel.app/
      - key: DATABASE_URL
        fromDatabase:
          name: campusmart-db
          property: connectionString

 databases:
  - name: campusmart-db
    databaseName: campusmart
    user: campusmart
    plan: free
