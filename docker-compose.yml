services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-random-string-of-50-characters}
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SQLITE_PATH: /data/db.sqlite3
      SEED_ARGS: "--with-orders"      # remove to start with listings only
    volumes: ["campusmart-data:/data"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  campusmart-data:
